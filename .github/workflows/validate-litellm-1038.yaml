name: Validate LiteLLM 1.103.8

on:
  push:
    branches:
      - automation/validate-litellm-1038

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      RUN_LIVE: "false"
      SSL_VERIFY: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry 1.8.5
        run: python -m pip install "poetry==1.8.5" "cleo==2.1.0"

      - name: Regenerate and validate lockfile
        run: |
          poetry --version
          poetry lock --no-update --no-interaction
          poetry check --lock
          git diff --check

      - name: Report dependency changes
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import tomllib

          before = tomllib.loads(subprocess.check_output(
              ["git", "show", "HEAD:poetry.lock"], text=True
          ))
          after = tomllib.loads(pathlib.Path("poetry.lock").read_text())
          old = {(p["name"], p["version"]) for p in before["package"]}
          new = {(p["name"], p["version"]) for p in after["package"]}
          report = {"removed": sorted(old - new), "added": sorted(new - old)}
          pathlib.Path("dependency-changes.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          assert [p["version"] for p in after["package"] if p["name"] == "litellm"] == ["1.103.8"]
          assert after["metadata"]["lock-version"] == "2.0"
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litellm-1.103.8-lock
          path: |
            poetry.lock
            dependency-changes.json
          if-no-files-found: error
          retention-days: 7

      - name: Install updated dependencies
        run: poetry install --with dev --no-root --no-interaction

      - name: Check installed dependencies
        run: |
          poetry run python -m pip check
          poetry run python -c "import importlib.metadata as m; assert m.version('litellm') == '1.103.8'; print('Testing LiteLLM', m.version('litellm'))"

      - name: Run existing LLM integration unit tests
        run: >-
          poetry run pytest
          tests/test_tool_calling_llm.py
          tests/test_llm_registry_refresh.py
          tests/core/test_llm*.py
          tests/core/test_model_limits.py
          tests/core/test_models.py
          tests/core/test_tool_calling_llm_errors.py
          -m "not llm" --no-cov -q
